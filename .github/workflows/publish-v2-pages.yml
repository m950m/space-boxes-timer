name: Publish approved Space Boxes V2 Pages
on:
  push:
    branches: [master]
    paths: ['.github/workflows/publish-v2-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/react-frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fec8be069fd563c44bbe5e50af563bdc4968818e
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: v2/react-frontend/package-lock.json
      - run: npm ci
      - run: npm run test:api
      - run: npm run test:local
      - run: npm run build:pages
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: v2/react-frontend/dist
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: publish
