name: React frontend checks
on:
  push:
    paths:
      - 'v2/react-frontend/**'
      - '.github/workflows/react-frontend-ci.yml'
  pull_request:
    paths:
      - 'v2/react-frontend/**'
      - '.github/workflows/react-frontend-ci.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/react-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: v2/react-frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
