name: Package Space Boxes V2 for SnapDeploy

on:
  workflow_dispatch:
    inputs:
      promote_production:
        description: 'Explicit production approval: update the watched tag only after staging and mail acceptance'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./v2
          file: ./v2/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:snapdeploy-${{ github.sha }}
          provenance: false
      - name: Promote only with explicit human release approval
        if: ${{ inputs.promote_production }}
        run: docker buildx imagetools create --tag "ghcr.io/${{ github.repository }}:snapdeploy-candidate" "ghcr.io/${{ github.repository }}:snapdeploy-${{ github.sha }}"
