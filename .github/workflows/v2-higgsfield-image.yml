name: Build and verify Space Boxes Higgsfield UI

on:
  push:
    branches: [feature/v2-higgsfield-ui]
    paths:
      - "v2/**"
      - ".github/workflows/v2-higgsfield-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build amd64 Docker image
        run: docker build --platform linux/amd64 -t space-boxes-higgsfield:verify -f v2/Dockerfile v2
      - name: Verify both frontend experiences are packaged
        run: |
          docker run --rm --entrypoint python space-boxes-higgsfield:verify -c '
          from pathlib import Path
          root = Path("/app/v2/frontend")
          home = (root / "index.html").read_text()
          old = (root / "classic.html").read_text()
          js = root / "js" / "space-boxes-new.js"
          css = root / "css" / "space-boxes-new.css"
          assert "space-boxes-new.js" in home and "<div id=\"root\"></div>" in home
          assert "app.js" in old and "planner.css" in old
          assert js.stat().st_size > 100000 and css.stat().st_size > 10000
          assert not (root / "js" / "space-boxes-new.js.gz").exists()
          print("PASS: new visual app, original advanced workspace, complete asset bundle")
          '
      - name: Validate Django release settings
        env:
          DJANGO_DEBUG: "0"
          DJANGO_ALLOWED_HOSTS: "example.com"
          DJANGO_CSRF_TRUSTED_ORIGINS: "https://example.com"
          DJANGO_TRUST_PROXY_HTTPS: "1"
          DJANGO_SSL_REDIRECT: "0"
          SPACE_BOXES_DB_NAME: "postgres"
          SPACE_BOXES_DB_USER: "dummy_app"
          SPACE_BOXES_DB_PASSWORD: "dummy-only"
          SPACE_BOXES_DB_HOST: "db.invalid"
          SPACE_BOXES_DB_PORT: "5432"
          SPACE_BOXES_DB_SSLMODE: "require"
          SPACE_BOXES_EMAIL_HOST: "smtp.invalid"
          SPACE_BOXES_FROM_EMAIL: "no-reply@example.com"
        run: |
          export DJANGO_SECRET_KEY="$(openssl rand -base64 64)"
          docker run --rm --entrypoint /app/v2/.venv/bin/python \
            -e DJANGO_DEBUG -e DJANGO_ALLOWED_HOSTS -e DJANGO_CSRF_TRUSTED_ORIGINS \
            -e DJANGO_TRUST_PROXY_HTTPS -e DJANGO_SSL_REDIRECT \
            -e DJANGO_SECRET_KEY -e SPACE_BOXES_DB_NAME -e SPACE_BOXES_DB_USER \
            -e SPACE_BOXES_DB_PASSWORD -e SPACE_BOXES_DB_HOST -e SPACE_BOXES_DB_PORT \
            -e SPACE_BOXES_DB_SSLMODE -e SPACE_BOXES_EMAIL_HOST -e SPACE_BOXES_FROM_EMAIL \
            space-boxes-higgsfield:verify v2/backend/manage.py check --deploy --fail-level ERROR
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image to existing SnapDeploy tag
        run: |
          docker tag space-boxes-higgsfield:verify "ghcr.io/${{ github.repository }}:snapdeploy-candidate"
          docker tag space-boxes-higgsfield:verify "ghcr.io/${{ github.repository }}:higgsfield-${{ github.sha }}"
          docker push "ghcr.io/${{ github.repository }}:snapdeploy-candidate"
          docker push "ghcr.io/${{ github.repository }}:higgsfield-${{ github.sha }}"
